name: 1. Generowanie Porannej Pigulki i Publikacja PWA

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'config/**'
      - 'prompts/**'
      - '.github/workflows/generate_pill.yml'
  workflow_dispatch:
    inputs:
      force_time:
        description: 'Wymuś generowanie pomijając ograniczenia okna godzinowego'
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [generate_pill]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-pill'
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Uruchomienie generatora Porannej Pigułki
        id: generator
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          FLAGS="--no-notify"
          if [ "${{ github.event.inputs.force_time }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FLAGS="$FLAGS --force-time"
          fi
          python scripts/main.py $FLAGS

      - name: Zapisz wygenerowane dane pigułki w repozytorium
        if: steps.generator.outputs.pill_generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ app/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(pill): aktualizacja porannej pigułki [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Brak nowych zmian w data/ lub app/data/."
          fi

      - name: Konfiguracja GitHub Pages
        if: github.event_name == 'push' || steps.generator.outputs.pill_generated == 'true'
        uses: actions/configure-pages@v5

      - name: Spakowanie artefaktu PWA (/app)
        if: github.event_name == 'push' || steps.generator.outputs.pill_generated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Publikacja PWA na GitHub Pages
        if: github.event_name == 'push' || steps.generator.outputs.pill_generated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Powiadomienie o awarii generowania (Zadanie 11)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python scripts/notifier.py --failure --reason "Błąd podczas generowania pigułki w zadaniu GitHub Actions."
