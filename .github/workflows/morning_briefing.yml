name: Poranna Pigulka - Generowanie i Publikacja PWA

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/morning_briefing.yml'
  schedule:
    # Siatka slotów cron z zapasem na wielogodzinne kolejkowanie darmowego GitHub Actions (~7-8h lag):
    # w dni bez kolejki sloty nocne są odrzucane w 1s przez strażnika (< 06:30 PL),
    # a przy opóźnieniu kolejki pierwszy slot po 06:30 PL generuje pigułkę; kolejne wykryją istniejący plik i zakończą się bez zmian.
    - cron: '35 21,22,23,0,1,2,3,4,5,6,7 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [morning_briefing]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-pill'
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Uruchomienie generatora Porannej Pigułki
        id: generator
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python scripts/main.py

      - name: Zapisz wygenerowane dane pigułki w repozytorium
        if: steps.generator.outputs.pill_generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ app/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(pill): aktualizacja porannej pigułki [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Brak nowych zmian w data/ lub app/data/."
          fi

      - name: Konfiguracja GitHub Pages
        if: github.event_name == 'push' || steps.generator.outputs.pill_generated == 'true'
        uses: actions/configure-pages@v5

      - name: Spakowanie artefaktu PWA (/app)
        if: github.event_name == 'push' || steps.generator.outputs.pill_generated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Publikacja PWA na GitHub Pages
        if: github.event_name == 'push' || steps.generator.outputs.pill_generated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Powiadomienie o awarii pipeline'u (Zadanie 11)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python scripts/notifier.py --failure --reason "Błąd workflowu Poranna Pigułka w GitHub Actions."
