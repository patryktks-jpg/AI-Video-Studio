name: Poranny Briefing Biznesowy

on:
  schedule:
    # 06:51 UTC = 07:51 czasu polskiego (czas zimowy UTC+1)
    # Wybór minuty 51 (zamiast pełnej 00) omija gigantyczny korek darmowych maszyn GitHuba
    - cron: '51 6 * * *'
  workflow_dispatch: # Przycisk "Run workflow" w zakładce Actions na GitHubie do testu ręcznego
  repository_dispatch: # Umożliwia natychmiastowe wywołanie przez zewnętrzny darmowy webhook (np. cron-job.org)
    types: [morning_briefing]

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Uruchomienie Porannego Briefingu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CITY: "Brzesko"
        run: |
          python tools/morning_briefing/main.py
