name: 2. Wysylka Porannej Pigulki o 8:00 (Telegram)

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Wymuś wysłanie nawet jeśli dziś już wysłano'
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [send_briefing, morning_briefing]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-pill'
  cancel-in-progress: false

jobs:
  send-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upewnij się, że dzisiejsza pigułka istnieje
        id: generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          TODAY_PL=$(TZ="Europe/Warsaw" date +%Y-%m-%d)
          if [ -f "data/${TODAY_PL}.json" ]; then
            echo "Pigułka na ${TODAY_PL} już istnieje w repozytorium."
            echo "pill_generated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Brak pigułki na ${TODAY_PL} — uruchamiam generację przed publikacją."
            python scripts/main.py --no-notify --force-time
          fi

      - name: Zapisz wygenerowaną pigułkę w repozytorium
        if: steps.generator.outputs.pill_generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ app/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(pill): aktualizacja porannej pigułki [skip ci]"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "Brak nowych zmian w data/ lub app/data/."
          fi

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5

      - name: Spakowanie artefaktu PWA (/app)
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Publikacja PWA na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wysłanie powiadomienia na Telegram (po publikacji Pages)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          FLAGS="--send-daily --no-emergency"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          python scripts/notifier.py $FLAGS

      - name: Zapisz rejestr wysłanych powiadomień w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ app/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore(notif): aktualizacja rejestru wysylki powiadomien [skip ci]"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "Brak nowych wpisów w sent_log.json."
          fi

      - name: Powiadomienie o awarii wysyłki (Zadanie 11)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python scripts/notifier.py --failure --reason "Błąd w zadaniu wysyłki powiadomienia o 8:00 w GitHub Actions."
